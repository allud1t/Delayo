name: Chrome Web Store Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'validate_only skips the store, upload_only uploads only, upload_and_publish submits for review'
        required: true
        default: validate_only
        type: choice
        options:
          - validate_only
          - upload_only
          - upload_and_publish

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and release Delayo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.6.5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release mode
        id: release-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          RELEASE_MODE="${INPUT_RELEASE_MODE:-upload_and_publish}"
          if [ "$EVENT_NAME" = "push" ]; then
            RELEASE_MODE="upload_and_publish"
          fi

          echo "value=$RELEASE_MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved release mode: $RELEASE_MODE"

      - name: Validate release version
        id: release-version
        run: |
          node ./scripts/release/validate-release.mjs \
            --event-name "${{ github.event_name }}" \
            --ref-name "${{ github.ref_name }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package extension
        id: package-extension
        shell: pwsh
        run: |
          & ./scripts/zip.ps1 `
            -SourceDir "dist" `
            -OutputDir "artifacts" `
            -BaseName "delayo-chrome-web-store" `
            -Version "${{ steps.release-version.outputs.version }}" `
            -GithubOutput $env:GITHUB_OUTPUT

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package-extension.outputs.archive_name }}
          path: ${{ steps.package-extension.outputs.archive_path }}
          if-no-files-found: error

      - name: Upload and optionally publish to Chrome Web Store
        if: ${{ steps.release-mode.outputs.value != 'validate_only' }}
        env:
          CWS_ACCESS_TOKEN: ${{ secrets.CWS_ACCESS_TOKEN }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_PUBLISH: ${{ steps.release-mode.outputs.value == 'upload_and_publish' }}
          CWS_ZIP_FILE: ${{ steps.package-extension.outputs.archive_path }}
        run: node ./scripts/release/publish-chrome-web-store.mjs
